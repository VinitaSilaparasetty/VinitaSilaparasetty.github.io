<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Access Request</title>
<meta name="description" content="Branching e-learning scenario: handling a GDPR data subject access request at a fictional company.">
<!--
  THE ACCESS REQUEST - a branching GDPR scenario
  ------------------------------------------------
  Single self-contained file: no external images, fonts, libraries or network calls.
  All characters and scenes are inline SVG drawn in code (see CHARACTERS / SCENES below).

  HOW TO EDIT TEXT: scroll to the "SCENARIO CONTENT" section of the <script>.
  Every screen is an entry in NODES. Options carry their text, feedback, legal citation,
  effects on the meters and the id of the next node. Endings are in ENDINGS.
  Lumaro Home Services and every person named here are fictional.
-->
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --ink:#1b2433; --muted:#4a5568; --line:#d5dde6; --bg:#eef2f6; --card:#ffffff; --soft:#f6f8fb;
    --brand:#0b6b6b; --brand-dark:#084f4f; --brand-tint:#e3f2f1;
    --good:#1d7a3e; --good-tint:#e5f4ea; --warn:#8f5200; --warn-tint:#fdf1df; --bad:#b42318; --bad-tint:#fdeceb;
    --focus:#1a56db; --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.07);
    --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
  .app{max-width:1000px;margin:0 auto;padding:12px 16px 28px}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:var(--brand-dark)}

  /* ---------- HUD (deadline + meters) ---------- */
  .hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);margin-bottom:12px}
  .hud[hidden]{display:none}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;margin-right:auto}
  .brand svg{flex:none}
  .stat{display:flex;align-items:center;gap:8px;min-width:0}
  .stat-label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .days{background:var(--brand-tint);border-radius:999px;padding:4px 12px 4px 8px;transition:background .4s}
  .days b{font-size:1.15rem}
  .days.warn{background:var(--warn-tint)} .days.warn b{color:var(--warn)}
  .days.bad{background:var(--bad-tint)} .days.bad b{color:var(--bad)}
  .days-unit{font-size:.85rem;color:var(--muted)}
  .meter{position:relative;flex-direction:column;align-items:flex-start;gap:2px}
  .mrow{display:flex;align-items:center;gap:8px}
  .bar{width:110px;height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;border:1px solid #cfd8e3}
  .fill{display:block;height:100%;width:50%;border-radius:99px;transition:width .7s cubic-bezier(.3,.9,.3,1),background-color .7s}
  #trustFill{background:var(--brand)}
  .meter-val{font-size:.85rem;font-weight:700;min-width:2ch;text-align:right}
  .delta{position:absolute;right:-6px;top:-14px;font-size:.75rem;font-weight:700;padding:0 6px;border-radius:99px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s;pointer-events:none}
  .delta.show{opacity:1;transform:none}
  .delta.up-good,.delta.down-good{background:var(--good-tint);color:var(--good)}
  .delta.up-bad,.delta.down-bad{background:var(--bad-tint);color:var(--bad)}
  .pulse{animation:pulse .7s ease}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  .linkbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.82rem;color:var(--muted)}
  .linkbtn:hover{background:var(--soft)}

  /* ---------- Main card ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .scene{display:block;width:100%;height:auto;background:#e4ecf2;border-bottom:1px solid var(--line)}
  .body{padding:18px 22px 22px}
  .eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .dots{display:flex;gap:4px}
  .dots i{width:18px;height:5px;border-radius:3px;background:#d7dee7}
  .dots i.done{background:var(--brand)} .dots i.now{background:var(--warn)}
  h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
  h2{font-size:1.4rem}
  /* Headings receive focus programmatically (tabindex=-1) so screen readers start reading there; they are not interactive, so no ring. */
  [tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
  .narr{margin:0 0 12px}
  .narr p{margin:.4em 0}
  .bubble{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0 12px}
  .bubble .who{display:block;font-size:.8rem;font-weight:700;color:var(--brand-dark);margin-bottom:2px}
  .prompt{font-weight:700;margin:14px 0 8px}

  /* choices */
  .choices{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,background .2s,transform .15s}
  .choice:hover:not([disabled]){border-color:var(--brand);background:var(--brand-tint)}
  .choice:active:not([disabled]){transform:scale(.995)}
  .choice .key{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand-dark);font-weight:700;font-size:.9rem}
  .choice[disabled]{cursor:default;opacity:.6}
  .choice[aria-pressed="true"]{opacity:1;border-color:var(--brand);background:var(--brand-tint)}
  .choice[aria-pressed="true"] .key{background:var(--brand);color:#fff}

  .btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--brand);color:#fff;transition:background .2s}
  .btn:hover{background:var(--brand-dark)}
  .btn.secondary{background:#fff;color:var(--brand-dark);border:2px solid var(--brand)}
  .btn.secondary:hover{background:var(--brand-tint)}
  .btn[disabled]{opacity:.5;cursor:default}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

  /* feedback */
  .feedback{margin-top:16px;border-radius:12px;border:1px solid var(--line);border-left:6px solid var(--brand);background:var(--soft);padding:14px 16px;animation:rise .35s ease}
  .feedback.best{border-left-color:var(--good)} .feedback.ok{border-left-color:var(--warn)} .feedback.poor{border-left-color:var(--bad)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .badge{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 9px;border-radius:99px;margin-right:6px;vertical-align:middle}
  .badge.best{background:var(--good-tint);color:var(--good)} .badge.ok{background:var(--warn-tint);color:var(--warn)} .badge.poor{background:var(--bad-tint);color:var(--bad)}
  .feedback h3{font-size:1.05rem;margin:.1em 0 .4em;display:inline}
  .feedback p{margin:.45em 0}
  .cite{display:inline-block;margin-top:4px;font-size:.85rem;font-weight:700;color:var(--brand-dark);background:var(--brand-tint);border-radius:6px;padding:2px 8px}
  .fb-list{margin:.4em 0;padding-left:1.2em}
  .fb-list li{margin:.2em 0}

  /* inbox */
  .inbox{display:grid;grid-template-columns:minmax(200px,38%) 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:300px}
  .mail-list{list-style:none;margin:0;padding:0;border-right:1px solid var(--line);background:var(--soft)}
  .mail-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 12px;position:relative}
  .mail-item:hover{background:#eaf0f5}
  .mail-item[aria-current="true"]{background:#fff;box-shadow:inset 4px 0 0 var(--brand)}
  .mail-item .from{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:.9rem}
  .mail-item .from time{font-weight:400;color:var(--muted);font-size:.78rem}
  .mail-item .subj{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mail-item.unread .subj{color:var(--ink)}
  .flagmark[hidden]{display:none}
  .flagmark{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--bad);margin-top:3px}
  .reader{padding:14px 16px;background:#fff}
  .reader .meta{font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
  .reader h3{font-size:1.05rem;margin:0 0 4px}
  .reader .mailbody p{margin:.5em 0}
  .flagbtn{margin-top:10px;border:2px solid var(--bad);color:var(--bad);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
  .flagbtn[aria-pressed="true"]{background:var(--bad);color:#fff}

  /* checklist */
  fieldset.check{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;margin:0}
  fieldset.check legend{font-weight:700;padding:0 6px}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px dashed var(--line)}
  .opt:last-of-type{border-bottom:0}
  .opt input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
  .opt label{flex:1;cursor:pointer}
  .opt .res{display:block;font-size:.85rem;margin-top:3px}
  .res.good{color:var(--good)} .res.bad{color:var(--bad)} .res.warn{color:var(--warn)}

  /* redaction document */
  .doc{border:1px solid var(--line);border-radius:6px;background:#fffdf8;padding:18px 20px;box-shadow:0 2px 0 #ece6d8;font-family:Consolas,"Courier New",monospace;font-size:.9rem;line-height:1.9}
  .doc h3{font-family:var(--font);font-size:1rem;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .doc .stamp{font-size:.72rem;color:var(--bad);border:2px solid var(--bad);border-radius:4px;padding:0 6px;transform:rotate(-3deg)}
  .tok{font:inherit;border:0;border-bottom:2px dotted #8a94a6;background:#fff3c4;padding:0 3px;border-radius:3px;color:var(--ink);transition:background .2s,color .2s}
  .tok:hover{background:#ffe58a}
  .tok[aria-pressed="true"]{background:#111;color:#111;border-bottom-color:#111;text-shadow:none}
  .tok[aria-pressed="true"] .tt{visibility:hidden}
  .tok[aria-pressed="true"]:hover{background:#333}
  .tok.miss{outline:3px solid var(--bad);outline-offset:1px}
  .tok.over{outline:3px solid var(--warn);outline-offset:1px}
  .counter{font-size:.85rem;color:var(--muted);margin-top:6px}

  /* call */
  .callbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:#0f2a3a;color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .callbar .dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:ring 1.6s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
  .patience{flex:1;min-width:140px}
  .patience .lbl{font-size:.78rem;opacity:.9}
  .ptrack{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
  .pfill{height:100%;width:100%;background:#fbbf24;transition:width 1s linear}
  .callbar button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:4px 10px;font-size:.82rem}
  .callbar button:hover{background:rgba(255,255,255,.12)}

  /* start + end */
  .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:center}
  .hero h1{font-size:2.1rem;margin:.1em 0 .25em;letter-spacing:-.01em}
  .kicker{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-dark)}
  .goal{font-size:1.08rem;color:var(--muted);margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.85rem}
  .panel{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px}
  .panel h3{font-size:1rem;margin:0 0 6px}
  .panel ol,.panel ul{margin:0;padding-left:1.3em}
  .panel li{margin:.25em 0}
  .cast{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .cast figure{margin:0;text-align:center;font-size:.8rem;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 4px}
  .cast figcaption b{display:block;font-size:.85rem}
  .cast svg{width:100%;max-width:110px;height:auto}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .stats3 div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stats3 b{display:block;font-size:1.5rem}
  .stats3 span{font-size:.8rem;color:var(--muted)}
  .endbadge{display:inline-block;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;padding:4px 12px;border-radius:99px}
  .endbadge.exemplary{background:var(--good-tint);color:var(--good)}
  .endbadge.clumsy{background:var(--warn-tint);color:var(--warn)}
  .endbadge.leak,.endbadge.complaint{background:var(--bad-tint);color:var(--bad)}
  .legal{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
  .review{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .review li{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
  .review .rh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:700}
  .review .rc{margin:.3em 0;font-size:.93rem}
  .review .rc span{color:var(--muted)}

  .rule{background:var(--brand-tint);border-radius:10px;padding:10px 14px;margin:12px 0}
  textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
  .aid{margin:0;padding-left:1.4em;display:grid;gap:8px}
  .aid li{padding-left:4px}
  .aid .cite{margin:0 0 0 4px;font-size:.78rem}
  @media print{ .hud,.row,.scene{display:none!important} body,html{background:#fff} .card{box-shadow:none;border:0} }

  /* ---------- Responsive ---------- */
  @media (max-width:720px){
    .hero{grid-template-columns:1fr}
    .bar{width:80px}
  }
  @media (max-width:560px){
    .app{padding:8px 10px 20px}
    .body{padding:14px 14px 18px}
    h2{font-size:1.2rem}
    .hero h1{font-size:1.6rem}
    .inbox{grid-template-columns:1fr}
    .mail-list{border-right:0;border-bottom:1px solid var(--line)}
    .cast{grid-template-columns:repeat(2,1fr)}
    .brand span{display:none}
    .hud{gap:8px 12px;padding:8px 10px}
    .bar{width:64px}
    .stat-label{font-size:.7rem}
    .doc{padding:12px;font-size:.84rem}
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud" id="hud" hidden>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0b6b6b"/><path d="M10 21 L20 12 L30 21 V30 H10Z" fill="#fff"/><path d="M20 19 C23 23 24 25 24 26.5 A4 4 0 0 1 16 26.5 C16 25 17 23 20 19Z" fill="#0b6b6b"/></svg>
      <span>The Access Request</span>
    </div>
    <div class="stat days" id="daysBox" aria-live="off">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="stat-label">Deadline</span>
      <span><b id="daysVal">30</b> <span class="days-unit" id="daysUnit">days left</span></span>
    </div>
    <div class="stat meter">
      <span class="stat-label" id="trustLbl">Customer trust</span>
      <div class="mrow"><div class="bar" id="trustBar" role="meter" aria-labelledby="trustLbl" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="fill" id="trustFill"></span></div>
      <span class="meter-val" id="trustVal" aria-hidden="true">50</span></div>
      <span class="delta" id="trustDelta" aria-hidden="true"></span>
    </div>
    <div class="stat meter">
      <span class="stat-label" id="riskLbl">Compliance risk</span>
      <div class="mrow"><div class="bar" id="riskBar" role="meter" aria-labelledby="riskLbl" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"><span class="fill" id="riskFill"></span></div>
      <span class="meter-val" id="riskVal" aria-hidden="true">20</span></div>
      <span class="delta" id="riskDelta" aria-hidden="true"></span>
    </div>
    <button class="linkbtn" id="restartBtn" type="button">Restart</button>
  </header>

  <main id="main" class="card" tabindex="-1"></main>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</div>

<script>
'use strict';
/* =====================================================================
   1. CHARACTERS (inline SVG, drawn in code)
   Each character is a head-and-shoulders bust in a 160 x 192 box.
   Expressions are swapped by changing brows + mouth (see FACES).
   ===================================================================== */
const CHARACTERS = {
  agent:  { name:'You', role:'Customer service agent', skin:'#e7b38c', shade:'#cf9a72', hair:'#3a2a20', style:'crop', top:'#0b6b6b', headset:true },
  marta:  { name:'Marta Feldkamp', role:'Customer', skin:'#f2c9a8', shade:'#dfad89', hair:'#9c4128', style:'bob', top:'#4c8a5a' },
  tobias: { name:'Tobias Rehnert', role:'Team lead', skin:'#d29a70', shade:'#b98058', hair:'#2b2724', style:'short', beard:true, glasses:true, top:'#2d4c7c' },
  dana:   { name:'Dana Weisskopf', role:'Data protection officer', skin:'#8a5a3c', shade:'#734a2f', hair:'#1d1715', style:'bun', top:'#6a4f9e', glasses:false }
};
const FACES = {
  neutral:   { brows:'M61 69 L74 68 M86 68 L99 69', mouth:'M72 100 Q80 103 88 100' },
  happy:     { brows:'M61 68 Q67 63 74 66 M86 66 Q93 63 99 68', mouth:'M69 97 Q80 110 91 97', blush:true },
  concerned: { brows:'M61 70 L74 65 M86 65 L99 70', mouth:'M72 104 Q80 98 88 104' },
  angry:     { brows:'M61 64 L75 70 M85 70 L99 64', mouth:'M70 105 Q80 95 90 105' }
};
const MOOD_WORDS = { neutral:'calm', happy:'pleased', concerned:'worried', angry:'annoyed' };
const HAIR_FRONT = {
  crop:  'M46 72 C42 40 62 30 82 30 C104 30 120 44 114 74 C110 58 98 50 84 50 C70 50 56 56 46 72 Z',
  bob:   'M46 70 C46 42 66 32 84 34 C104 34 118 48 114 70 C102 56 84 50 70 54 C60 57 52 62 46 70 Z',
  short: 'M47 66 C46 42 64 34 82 34 C102 34 116 46 113 66 C108 54 94 48 80 49 C66 49 54 55 47 66 Z',
  bun:   'M46 74 C44 44 62 34 80 34 C100 34 118 44 114 74 C108 56 96 48 80 48 C64 48 52 56 46 74 Z'
};

/** Returns SVG markup (a <g>) for one character with the given mood. */
function person(id, mood){
  const c = CHARACTERS[id], f = FACES[mood] || FACES.neutral, ink = '#2a1d17';
  let s = '';
  if (c.style === 'bob') s += `<path d="M40 84 C34 40 58 26 82 26 C108 26 128 42 120 86 L122 120 C112 126 102 118 104 106 L104 66 L56 66 L56 106 C58 118 48 126 38 120 Z" fill="${c.hair}"/>`;
  if (c.style === 'bun') s += `<circle cx="80" cy="30" r="15" fill="${c.hair}"/>`;
  s += `<path d="M12 192 C12 146 40 130 80 130 C120 130 148 146 148 192 Z" fill="${c.top}"/>`;
  s += `<path d="M64 131 L80 152 L96 131" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="3" stroke-linejoin="round"/>`;
  s += `<rect x="68" y="104" width="24" height="32" rx="10" fill="${c.shade}"/>`;
  s += `<circle cx="47" cy="80" r="7" fill="${c.shade}"/><circle cx="113" cy="80" r="7" fill="${c.shade}"/>`;
  s += `<ellipse cx="80" cy="76" rx="33" ry="38" fill="${c.skin}"/>`;
  if (c.beard) s += `<path d="M50 90 C52 114 66 120 80 120 C94 120 108 114 110 90 C104 106 94 110 80 110 C66 110 56 106 50 90Z" fill="${c.hair}" opacity=".85"/>`;
  s += `<path d="${HAIR_FRONT[c.style]}" fill="${c.hair}"/>`;
  if (f.blush) s += `<circle cx="60" cy="93" r="5" fill="#f08a8a" opacity=".35"/><circle cx="100" cy="93" r="5" fill="#f08a8a" opacity=".35"/>`;

  s += `<path d="M80 84 Q77 92 81 93" stroke="${c.shade}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  s += `<path d="${f.mouth}" stroke="${c.beard ? '#f3e2d4' : ink}" stroke-width="2.8" stroke-linecap="round" fill="none"/>`;

  return `<g>${s}</g>`;
}

/** Builds a full scene SVG. cast = [[characterId, mood], ...]. opts.call puts the 2nd character in a phone panel. */
function sceneSVG(bg, cast, opts={}){
  const scene = SCENES[bg] || SCENES.office;
  const n = cast.length;
  const xs = n===1 ? [240] : n===2 ? [70,390] : [20,230,440];
  let people = '';
  cast.forEach(([id,mood],i)=>{
    if (opts.call && i===1){
      people += `<g><rect x="368" y="18" width="250" height="204" rx="18" fill="#0f2a3a"/><text x="493" y="44" text-anchor="middle" fill="#fff" font-size="14" font-family="Segoe UI,Arial" font-weight="700">On the line</text>
        <circle cx="493" cy="130" r="72" fill="#1d4a63"/><g transform="translate(413 52) scale(1)">${person(id,mood)}</g></g>`;
    } else {
      people += `<g transform="translate(${xs[i]} 32) scale(1.08)">${person(id,mood)}</g>`;
    }
  });
  // desk + name plates in the foreground
  let fg = `<rect x="0" y="206" width="640" height="34" fill="#b9875c"/><rect x="0" y="206" width="640" height="5" fill="#a5754d"/>`;
  cast.forEach(([id],i)=>{
    const c = CHARACTERS[id];
    const cx = (opts.call && i===1) ? 493 : xs[i]+86;
    if (opts.call && i===1) return;
    fg += `<rect x="${cx-62}" y="214" width="124" height="20" rx="5" fill="#fff" opacity=".95"/><text x="${cx}" y="228" text-anchor="middle" font-size="12" font-family="Segoe UI,Arial" font-weight="700" fill="#1b2433">${c.name}</text>`;
  });
  if (opts.call && cast[1]) fg += `<rect x="431" y="214" width="124" height="20" rx="5" fill="#fff"/><text x="493" y="228" text-anchor="middle" font-size="12" font-family="Segoe UI,Arial" font-weight="700" fill="#1b2433">${CHARACTERS[cast[1][0]].name}</text>`;
  const alt = `${scene.label}. ` + cast.map(([id,m])=> id==='agent' ? `You, wearing a headset, look ${MOOD_WORDS[m]}` : `${CHARACTERS[id].name} (${CHARACTERS[id].role}) looks ${MOOD_WORDS[m]}`).join('. ') + '.';
  return `<svg class="scene" viewBox="0 0 640 240" role="img" aria-label="${alt}" preserveAspectRatio="xMidYMid slice">${scene.draw()}${people}${fg}</svg>`;
}

const BREACH_FLAGS = ['stoodFirm','deleted','withheld','late'];
const CLUMSY_FLAGS = ['inboxMissed','notLogged','formDemanded','excessiveId','newAddress','feeRecovered','refusalRecovered',
                      'incompleteSearch','overCollected','overRedacted','askedDrop','incompleteResponse','waiver','posted','unverifiedSend'];

/** Decides the ending from the final state. Order matters: worst outcome wins. */
function computeEnding(s){
  if (s.day + s.lost > s.deadline) s.flags.late = true;
  if (BREACH_FLAGS.some(f=>s.flags[f]) || s.risk >= 80) return 'complaint';
  if (s.flags.thirdPartyLeak) return 'leak';
  if (CLUMSY_FLAGS.some(f=>s.flags[f]) || s.risk > 35 || score(s) < 85) return 'clumsy';
  return 'exemplary';
}

/* =====================================================================
   4. ENGINE  (you shouldn't need to edit below to change text)
   ===================================================================== */
const $ = sel => document.querySelector(sel);
const main = $('#main'), live = $('#live');
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let S = null;          // current state
let callTimer = null;  // phone-call pressure timer

function freshState(){
  return { trust:50, risk:20, day:0, lost:0, deadline:DEADLINE_DAYS, extended:false, flags:{}, log:[], points:0, max:0, moods:{}, ending:null };
}
const val = (v, s) => typeof v === 'function' ? v(s) : v;
const clamp = n => Math.max(0, Math.min(100, n));
function dayNow(s){ return s.day + s.lost; }
function daysLeft(s){ return s.deadline - dayNow(s); }
function score(s){ return s.max ? Math.round(s.points / s.max * 100) : 0; }
const QUALITY = { best:{label:'Best practice', pts:2}, ok:{label:'Acceptable, with costs', pts:1}, poor:{label:'Risky', pts:0} };
function announce(msg){ live.textContent = ''; setTimeout(()=>{ live.textContent = msg; }, 60); }

/* ---------- HUD ---------- */
function updateHud(prev){
  $('#trustFill').style.width = S.trust + '%';
  $('#riskFill').style.width = S.risk + '%';
  $('#riskFill').style.backgroundColor = S.risk >= 60 ? '#b42318' : S.risk >= 35 ? '#c26a00' : '#3b8f5a';
  $('#trustVal').textContent = S.trust; $('#riskVal').textContent = S.risk;
  [['trust','Customer trust'],['risk','Compliance risk']].forEach(([k,l])=>{
    const bar = $('#'+k+'Bar'); bar.setAttribute('aria-valuenow', S[k]); bar.setAttribute('aria-valuetext', `${l}: ${S[k]} out of 100`);
  });
  const left = daysLeft(S), box = $('#daysBox');
  $('#daysVal').textContent = Math.abs(left);
  $('#daysUnit').textContent = (left < 0 ? 'days overdue' : (left === 1 ? 'day left' : 'days left')) + (S.extended ? ' (extended)' : '');
  box.classList.toggle('warn', left >= 0 && left <= 10);
  box.classList.toggle('bad', left < 0 || left <= 3);
  if (prev){
    showDelta('trust', S.trust - prev.trust, true);
    showDelta('risk', S.risk - prev.risk, false);
    if (dayNow(S) !== prev.dayNow || S.deadline !== prev.deadline) pulse(box);
  }
}
function showDelta(k, d, upIsGood){
  if (!d) return;
  const el = $('#'+k+'Delta');
  el.textContent = (d > 0 ? '+' : '−') + Math.abs(d);
  el.className = 'delta show ' + (d > 0 ? (upIsGood ? 'up-good' : 'up-bad') : (upIsGood ? 'down-bad' : 'down-good'));
  pulse(el.parentElement);
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.className = 'delta'; }, 1800);
}
function pulse(el){ if (reduceMotion) return; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }

function applyFx(fx){
  const prev = { trust:S.trust, risk:S.risk, dayNow:dayNow(S), deadline:S.deadline };
  fx = fx || {};
  S.trust = clamp(S.trust + (fx.trust||0));
  S.risk  = clamp(S.risk + (fx.risk||0));
  S.lost += fx.lost || 0;
  if (fx.extend && !S.extended && daysLeft(S) >= 0){ S.extended = true; S.deadline = EXTENDED_DEADLINE_DAYS; }
  Object.assign(S.flags, fx.flags || {});
  updateHud(prev);
}

/* ---------- Shared screen frame ---------- */
function frame(node, inner){
  const cast = node.scene.cast.map(([id,m])=>[id, S.moods[id] || m]);
  const stepHtml = node.step
    ? `<span>Decision ${node.step} of ${TOTAL_STEPS}</span><span class="dots" aria-hidden="true">${Array.from({length:TOTAL_STEPS},(_,i)=>`<i class="${i+1<node.step?'done':i+1===node.step?'now':''}"></i>`).join('')}</span>`
    : `<span>${node.label || 'Complication'}</span>`;
  main.innerHTML = `<div id="sceneWrap">${sceneSVG(node.scene.bg, cast, {call:node.scene.call})}</div>
    <div class="body">
      <div class="eyebrow">${stepHtml}<span>Day ${dayNow(S)}</span></div>
      <h2 id="nodeTitle" tabindex="-1">${val(node.title, S)}</h2>
      <div class="narr">${val(node.text, S)}</div>
      ${inner}
      <div id="fb"></div>
    </div>`;
  $('#nodeTitle').focus({preventScroll:true});
  toTop();
}
function redrawScene(node){
  const cast = node.scene.cast.map(([id,m])=>[id, S.moods[id] || m]);
  $('#sceneWrap').innerHTML = sceneSVG(node.scene.bg, cast, {call:node.scene.call});
}

/** Scrolls the top of the card into view. Inside an iframe this also scrolls the host page (e.g. Rise). */
function toTop(){ const top = $('.app'); try { top.scrollIntoView({ block:'start', behavior: reduceMotion ? 'auto' : 'smooth' }); } catch(e){ top.scrollIntoView(); } }

/** Records a decision, shows the feedback panel and a Continue button. */
function showFeedback(node, choiceText, r, next, extraHtml=''){
  const q = QUALITY[r.quality];
  S.points += q.pts; S.max += 2;
  applyFx(r.fx);
  if (r.react){ Object.assign(S.moods, r.react); redrawScene(node); }
  S.log.push({ title: val(node.title, S), step: node.step, choice: choiceText, quality: r.quality, result: r.result, cite: r.cite });
  const fb = $('#fb');
  fb.innerHTML = `<section class="feedback ${r.quality}" aria-labelledby="fbTitle">
      <span class="badge ${r.quality}">${q.label}</span><h3 id="fbTitle" tabindex="-1">What happened</h3>
      <p>${r.result}</p>${extraHtml}
      <p><b>Why is it important?</b> ${r.why}</p>${r.note ? `<p><b>Note:</b> ${r.note}</p>` : ''}
      <span class="cite">${r.cite}</span>
      <div class="row"><button class="btn" id="nextBtn" type="button">Continue <span aria-hidden="true">→</span></button></div>
    </section>`;
  announce(`${q.label}. ${r.result}`);
  $('#fbTitle').focus();
  $('#nextBtn').addEventListener('click', ()=> go(next));
}

/* ---------- Renderers per node type ---------- */
function renderChoice(node){
  const opts = node.options;
  frame(node, `<p class="prompt" id="promptLbl">${node.prompt || 'What do you do?'}</p>
    <ul class="choices" aria-labelledby="promptLbl">${opts.map((o,i)=>`<li><button class="choice" type="button" data-i="${i}" aria-pressed="false"><span class="key" aria-hidden="true">${'ABC'[i]}</span><span>${o.text}</span></button></li>`).join('')}</ul>`);
  main.querySelectorAll('.choice').forEach(b=> b.addEventListener('click', ()=>{
    stopCallTimer();
    const o = opts[+b.dataset.i];
    main.querySelectorAll('.choice').forEach(x=>{ x.disabled = true; });
    b.setAttribute('aria-pressed','true');
    showFeedback(node, o.text, o, val(o.next, S));
  }));
}

function renderCall(node){
  renderChoice(node);
  // Pressure bar: purely atmospheric. It never ends the call or costs points (WCAG 2.2.1).
  const bar = document.createElement('div');
  bar.className = 'callbar';
  bar.innerHTML = `<span class="dot" aria-hidden="true"></span><span><b>Call in progress</b> · 0123 456 0177 (not on file)</span>
    <div class="patience" aria-hidden="true"><div class="lbl">Marta's patience</div><div class="ptrack"><div class="pfill" id="pfill"></div></div></div>
    <button type="button" id="timerBtn" aria-pressed="false">Pause timer</button>
    <span class="sr-only">The patience bar is for atmosphere only. It never ends the call or affects your score.</span>`;
  main.querySelector('.narr').before(bar);
  let t = 25, paused = false; const total = 25;
  const fill = $('#pfill');
  $('#timerBtn').addEventListener('click', e=>{ paused = !paused; e.currentTarget.textContent = paused ? 'Resume timer' : 'Pause timer'; e.currentTarget.setAttribute('aria-pressed', String(paused)); });
  callTimer = setInterval(()=>{
    if (paused) return;
    t = Math.max(0, t-1);
    fill.style.width = (t/total*100) + '%';
    if (t === 12 && !S.moods.marta){ S.moods.marta = 'angry'; redrawScene(node); delete S.moods.marta; }
    if (t === 0){
      stopCallTimer();
      const p = document.createElement('div'); p.className = 'bubble';
      p.innerHTML = `<span class="who">Marta Feldkamp</span>"Hello? Are you still there?" <span class="sr-only">(No penalty. Take your time.)</span>`;
      main.querySelector('.narr').append(p);
    }
  }, 1000);
}
function stopCallTimer(){ if (callTimer){ clearInterval(callTimer); callTimer = null; } }

function renderPredict(node){
  frame(node, `<p class="prompt" id="promptLbl">${node.prompt}</p>
    <ul class="choices" aria-labelledby="promptLbl">${node.options.map((o,i)=>`<li><button class="choice" type="button" data-i="${i}" aria-pressed="false"><span class="key" aria-hidden="true">${'ABC'[i]}</span><span>${o.text}</span></button></li>`).join('')}</ul>`);
  main.querySelectorAll('.choice').forEach(b=> b.addEventListener('click', ()=>{
    S.prediction = +b.dataset.i;
    main.querySelectorAll('.choice').forEach(x=>{ x.disabled = true; });
    b.setAttribute('aria-pressed','true');
    $('#fb').innerHTML = `<section class="feedback" aria-labelledby="fbTitle"><h3 id="fbTitle" tabindex="-1">Answer saved</h3>
      <p>Keep it in mind. You will find out in the inbox.</p>
      <div class="row"><button class="btn" id="nextBtn" type="button">Go to the inbox <span aria-hidden="true">→</span></button></div></section>`;
    announce('Answer saved. You will find out in the inbox.');
    $('#fbTitle').focus();
    $('#nextBtn').addEventListener('click', ()=> go(node.next));
  }));
}

function renderInbox(node){
  const flagged = new Set(); let current = node.emails[0].id; const opened = new Set([current]);
  frame(node, `<div class="inbox">
      <ul class="mail-list" aria-label="Inbox, ${node.emails.length} messages">${node.emails.map(m=>`<li><button type="button" class="mail-item" data-id="${m.id}">
        <span class="from"><span>${m.from}</span><time>${m.time}</time></span><span class="subj">${m.subject}</span><span class="flagmark" hidden>■ Flagged</span></button></li>`).join('')}</ul>
      <div class="reader" id="reader" aria-live="off"></div>
    </div>
    <div class="row"><button class="btn" id="checkBtn" type="button">Check my flags</button><span class="counter" id="flagCount">0 flagged</span></div>`);
  const draw = ()=>{
    const m = node.emails.find(e=>e.id===current);
    main.querySelectorAll('.mail-item').forEach(b=>{
      b.setAttribute('aria-current', String(b.dataset.id===current));
      b.classList.toggle('unread', !opened.has(b.dataset.id));
      b.querySelector('.flagmark').hidden = !flagged.has(b.dataset.id);
      b.setAttribute('aria-label', `${b.querySelector('.from span').textContent}: ${node.emails.find(e=>e.id===b.dataset.id).subject}${flagged.has(b.dataset.id)?', flagged':''}`);
    });
    $('#reader').innerHTML = `<h3>${m.subject}</h3><div class="meta">From <b>${m.from}</b> · ${m.time}</div><div class="mailbody">${m.body}</div>
      <button type="button" class="flagbtn" id="flagBtn" aria-pressed="${flagged.has(m.id)}" ${S._inboxDone?'disabled':''}>${flagged.has(m.id)?'Flagged as access request':'Flag as access request'}</button>
      ${S._inboxDone ? `<p class="res ${m.isRequest?'good':''}"><b>${m.why}</b></p>` : ''}`;
    $('#flagBtn').addEventListener('click', ()=>{ flagged.has(m.id) ? flagged.delete(m.id) : flagged.add(m.id); draw(); $('#flagBtn').focus(); });
    $('#flagCount').textContent = `${flagged.size} flagged`;
  };
  main.querySelectorAll('.mail-item').forEach(b=> b.addEventListener('click', ()=>{ current = b.dataset.id; opened.add(current); draw(); }));
  S._inboxDone = false; draw();
  $('#checkBtn').addEventListener('click', ()=>{
    const req = node.emails.filter(e=>e.isRequest).map(e=>e.id);
    const gotAll = req.every(id=>flagged.has(id));
    const extra = [...flagged].filter(id=>!req.includes(id));
    const quality = !gotAll ? 'poor' : (extra.length ? 'ok' : 'best');
    S._inboxDone = true; draw();
    $('#checkBtn').disabled = true;
    const r = { quality,
      fx: quality==='poor' ? { risk:10, flags:{inboxMissed:true} } : { risk: quality==='best' ? -5 : 0 },
      result: quality==='best' ? 'You spotted the one message that contains an access request.'
        : quality==='ok' ? `You spotted Marta's request, but also flagged ${extra.length} message${extra.length>1?'s':''} that ${extra.length>1?'are':'is'} not an access request.`
        : 'You missed the access request hidden in Marta\'s complaint.',
      why:'A request does not have to say "GDPR", use a form or come through a set channel. It can even be made verbally. What counts is that the person asks for their personal data.',
      cite: node.cite };
    const pred = (S.prediction != null) ? `<p><b>Your prediction:</b> "${NODES.predict.options[S.prediction].text}" ${S.prediction === NODES.predict.correct ? 'That was right.' : 'Marta\'s email shows otherwise: wording and channel do not matter.'}</p>` : '';
    const list = pred + `<ul class="fb-list">${node.emails.map(e=>`<li><b>${e.from}:</b> ${e.why}</li>`).join('')}</ul>`;
    showFeedback(node, `Flagged: ${flagged.size ? [...flagged].map(id=>node.emails.find(e=>e.id===id).from).join(', ') : 'nothing'}`, r, node.next, list);
  });
}

function renderChecklist(node){
  frame(node, `<fieldset class="check"><legend>${node.legend}</legend>
      ${node.items.map(i=>`<div class="opt"><input type="checkbox" id="c_${i.id}" value="${i.id}"><label for="c_${i.id}">${i.label}<span class="res" id="r_${i.id}"></span></label></div>`).join('')}
    </fieldset>
    <div class="row"><button class="btn" id="checkBtn" type="button">Check my selection</button></div>`);
  $('#checkBtn').addEventListener('click', ()=>{
    const sel = new Set([...main.querySelectorAll('fieldset input:checked')].map(i=>i.value));
    const r = node.evaluate(sel, S);
    node.items.forEach(i=>{
      const box = $('#c_'+i.id), res = $('#r_'+i.id); box.disabled = true;
      const picked = sel.has(i.id);
      if (i.correct && picked){ res.className='res good'; res.textContent = '✓ Needed. ' + i.why; }
      else if (i.correct){ res.className='res bad'; res.textContent = 'Missed, so it would be absent from the response. ' + i.why; }
      else if (picked){ res.className='res bad'; res.textContent = 'Not needed. ' + i.why; }
      else { res.className='res good'; res.textContent = 'Left out. ' + i.why; }
    });
    $('#checkBtn').disabled = true;
    const label = [...sel].map(id=>node.items.find(i=>i.id===id).label).join('; ') || 'nothing';
    showFeedback(node, `Selected: ${label}`, r, node.next);
  });
}

function renderRedact(node){
  const sel = new Set();
  const docHtml = node.doc.replace(/\[\[(\w+)\]\]/g, (_,k)=>`<button type="button" class="tok" data-k="${k}" aria-pressed="false"><span class="tt">${node.tokens[k].text}</span></button>`);
  frame(node, `<div class="doc" role="group" aria-label="Job ticket 48213. Each highlighted item is a toggle button: pressed means redacted.">
      <h3><span>Job ticket #48213 (extract)</span><span class="stamp">COPY FOR DATA SUBJECT</span></h3>${docHtml}</div>
    <p class="counter" id="redCount">0 items redacted</p>
    <div class="row"><button class="btn" id="checkBtn" type="button">Check redactions</button></div>`);
  main.querySelectorAll('.tok').forEach(b=> b.addEventListener('click', ()=>{
    if (b.dataset.locked) return;
    const k = b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k);
    b.setAttribute('aria-pressed', String(sel.has(k)));
    b.setAttribute('aria-label', (sel.has(k) ? 'Redacted: ' : '') + node.tokens[k].text);
    $('#redCount').textContent = `${sel.size} item${sel.size===1?'':'s'} redacted`;
  }));
  $('#checkBtn').addEventListener('click', ()=>{
    const r = node.evaluate(sel);
    main.querySelectorAll('.tok').forEach(b=>{ b.dataset.locked = '1'; b.setAttribute('aria-disabled','true');
      if (r.missed.includes(b.dataset.k)) b.classList.add('miss'); if (r.over.includes(b.dataset.k)) b.classList.add('over'); });
    $('#checkBtn').disabled = true;
    const t = node.tokens;
    const list = `<ul class="fb-list">${Object.keys(t).map(k=>{
      const red = sel.has(k), ok = red === t[k].third;
      return `<li><b>${ok ? '✓' : '✗'} ${t[k].text}</b>: ${red?'redacted':'left visible'}. ${t[k].why}</li>`; }).join('')}</ul>`;
    showFeedback(node, `Redacted ${sel.size}: ${[...sel].map(k=>t[k].text).join(', ') || 'nothing'}`, r, node.next, list);
  });
}

/* ---------- Start, ending, review ---------- */
function renderStart(){
  $('#hud').hidden = true;
  const castFig = id => `<figure><svg viewBox="0 0 160 192" role="img" aria-label="${CHARACTERS[id].name}"><rect width="160" height="192" fill="#e4ecf2" rx="14"/>${person(id, id==='tobias'?'concerned':'neutral')}</svg><figcaption><b>${CHARACTERS[id].name}</b>${CHARACTERS[id].role}</figcaption></figure>`;
  main.innerHTML = `${sceneSVG('office', [['agent','happy'],['marta','concerned']])}
    <div class="body">
      <div class="hero">
        <div>
          <div class="kicker">Branching scenario · GDPR</div>
          <h1 id="nodeTitle" tabindex="-1">The Access Request</h1>
          <p class="goal">Handle a customer's request for her personal data on time and by the book, even under pressure.</p>
          <div class="chips"><span class="chip">About 8 minutes</span><span class="chip">10 decisions</span><span class="chip">DSAR checklist at the end</span><span class="chip">4 possible endings</span></div>
          <div class="row"><button class="btn" id="startBtn" type="button">Start <span aria-hidden="true">→</span></button></div>
        </div>
        <div class="hero-art">
          <div class="panel"><h3>Learning objectives</h3><p style="margin:.2em 0 .4em">By the end, you will be able to:</p><ol>
            <li>Identify a data subject access request in an informal message, whatever its wording or channel.</li>
            <li>Apply the GDPR rules on deadline, extension, fees and identity checks to a live request (Art. 12).</li>
            <li>Assemble a complete response that contains the Art. 15 information and redacts third-party data.</li></ol></div>
        </div>
      </div>
      <div class="panel"><h3>How it works</h3><ul>
        <li>You play a customer service agent at <b>Lumaro Home Services</b>, a fictional home-repair company in Germany.</li>
        <li>Watch the <b>deadline</b>, <b>customer trust</b> and <b>compliance risk</b> at the top. Your choices change what happens next.</li>
        <li>Every screen works with a keyboard. The one timer is for atmosphere only. You can pause it and it never costs you anything.</li></ul></div>
      <div class="cast" aria-label="Characters">${['agent','marta','tobias','dana'].map(castFig).join('')}</div>
      <p class="legal">All companies, people and data in this scenario are fictional. Training, not legal advice.</p>
    </div>`;
  $('#startBtn').addEventListener('click', ()=>{ S = freshState(); $('#hud').hidden = false; updateHud(); go('predict'); });
}

function renderEnding(){
  stopCallTimer();
  const key = S.ending || (S.ending = computeEnding(S));
  const e = ENDINGS[key];
  const issues = Object.keys(S.flags).filter(f=>S.flags[f] && FLAG_NOTES[f]).map(f=>`<li>${FLAG_NOTES[f]}</li>`).join('');
  const sc = score(S);
  main.innerHTML = `${sceneSVG(e.scene.bg, e.scene.cast)}
    <div class="body">
      <span class="endbadge ${key}">${e.badge}</span>
      <h2 id="nodeTitle" tabindex="-1">${e.title}</h2>
      <div class="narr">${val(e.text, S)}</div>
      ${issues && key!=='exemplary' ? `<div class="panel"><h3>${key==='clumsy'?'What made it clumsy':'What went wrong along the way'}</h3><ul>${issues}</ul></div>` : ''}
      ${e.rule ? `<p class="rule"><b>Rule to keep:</b> ${e.rule}</p>` : ''}
      <div class="panel"><h3><label for="reflect">What will you do differently next time a request arrives?</label></h3>
        <textarea id="reflect" rows="3">${(S.reflection||'').replace(/</g,'&lt;')}</textarea>
        <p class="counter">Your answer stays in this browser tab. It is not saved or sent anywhere.</p></div>
      <div class="stats3"><div><b>${sc}%</b><span>Decision score</span></div><div><b>${S.trust}</b><span>Customer trust</span></div><div><b>${S.risk}</b><span>Compliance risk</span></div></div>
      <div class="row"><button class="btn" id="reviewBtn" type="button">Review your decisions</button><button class="btn secondary" id="aidBtn" type="button">DSAR checklist</button><button class="btn secondary" id="replayBtn" type="button">Replay</button></div>
      <p class="legal">Legal content correct as of 6 November 2026. Training, not legal advice. Based on Regulation (EU) 2016/679 (GDPR), Arts. 4, 5, 12, 15, 32, 33, 77. Lumaro Home Services and all characters are fictional.</p>
    </div>`;
  $('#nodeTitle').focus({preventScroll:true}); toTop();
  announce(`Scenario complete. Ending: ${e.badge}. Score ${sc} percent.`);
  $('#reflect').addEventListener('input', e=>{ S.reflection = e.target.value; });
  $('#reviewBtn').addEventListener('click', renderReview);
  $('#aidBtn').addEventListener('click', renderJobAid);
  $('#replayBtn').addEventListener('click', ()=>{ renderStart(); $('#nodeTitle').focus(); });
  // Tell a host page (e.g. an LMS wrapper) that the learner finished.
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ type:'scenario-complete', ending:key, score:sc }, '*'); } catch(err){}
}

function renderReview(){
  main.innerHTML = `<div class="body">
      <div class="eyebrow"><span>Debrief</span></div>
      <h2 id="nodeTitle" tabindex="-1">Your decisions</h2>
      <p>Each choice, what it led to, and the rule behind it.</p>
      <ol class="review">${S.log.map((l,i)=>`<li>
        <div class="rh"><span>${l.step ? 'Decision '+l.step : 'Complication'}: ${l.title}</span><span class="badge ${l.quality}">${QUALITY[l.quality].label}</span></div>
        <p class="rc"><span>You chose:</span> ${l.choice}</p>
        <p class="rc"><span>Consequence:</span> ${l.result}</p>
        <span class="cite">${l.cite}</span></li>`).join('')}</ol>
      <div class="row"><button class="btn secondary" id="backBtn" type="button">Back to ending</button><button class="btn secondary" id="aidBtn" type="button">DSAR checklist</button><button class="btn" id="replayBtn" type="button">Replay</button></div>
      <p class="legal">Legal content correct as of 6 November 2026. Training, not legal advice.</p>
    </div>`;
  $('#nodeTitle').focus({preventScroll:true}); toTop();
  $('#backBtn').addEventListener('click', renderEnding);
  $('#aidBtn').addEventListener('click', renderJobAid);
  $('#replayBtn').addEventListener('click', ()=>{ renderStart(); $('#nodeTitle').focus(); });
}

/* ---------- Job aid: one-screen DSAR checklist (edit JOB_AID to change it) ---------- */
const JOB_AID = [
  ['Spot it', 'Any clear request for "my data" counts, in any wording and any channel, even by phone.', 'Art. 15(1)'],
  ['Log it', 'Record the date it arrived and acknowledge it. The deadline is one month from receipt.', 'Art. 12(3)'],
  ['Check identity only if in doubt', 'Use details you already hold first. Ask for ID documents only if you really need them.', 'Art. 12(6)'],
  ['Do not charge or refuse', 'The first copy is free. Refusing needs proof that the request is manifestly unfounded or excessive.', 'Art. 12(5), 15(3)'],
  ['Search every system', 'CRM, tickets, field notes, call recordings, email, billing, marketing lists etc.', 'Art. 15(1)'],
  ['Keep awkward data in', 'Opinions about the person are their data. Do not delete or hold back data once a request is in.', 'Art. 4(1), 5(1)(a)'],
  ['Redact other people', 'Black out third-party details. Keep the requester\'s own data visible.', 'Art. 15(4)'],
  ['Add the Art. 15 information', 'Purposes, categories, recipients, retention, other rights, the right to complain, the source and automated decisions.', 'Art. 15(1)(a)–(h)'],
  ['Need more time?', 'Tell the person within the first month and give reasons. You can extend by up to two further months.', 'Art. 12(3)'],
  ['Send it securely', 'Electronic form if they asked electronically. Use a verified address and protection in transit.', 'Art. 15(3), 32']
];
function renderJobAid(){
  main.innerHTML = `<div class="body">
      <div class="eyebrow"><span>Job aid</span></div>
      <h2 id="nodeTitle" tabindex="-1">DSAR checklist</h2>
      <p>Keep this next to the inbox. Print it if you like.</p>
      <ol class="aid">${JOB_AID.map(([h,t,c])=>`<li><b>${h}${/[?.]$/.test(h) ? '' : '.'}</b> ${t} <span class="cite">GDPR ${c}</span></li>`).join('')}</ol>
      <div class="row"><button class="btn secondary" id="backBtn" type="button">Back to ending</button><button class="btn secondary" id="printBtn" type="button">Print checklist</button><button class="btn" id="replayBtn" type="button">Replay</button></div>
      <p class="legal">Legal content correct as of 6 November 2026. Training, not legal advice.</p>
    </div>`;
  $('#nodeTitle').focus({preventScroll:true}); toTop();
  $('#backBtn').addEventListener('click', renderEnding);
  $('#printBtn').addEventListener('click', ()=> window.print());
  $('#replayBtn').addEventListener('click', ()=>{ renderStart(); $('#nodeTitle').focus(); });
}

/* ---------- Router ---------- */
function go(id){
  stopCallTimer();
  if (id === 'END') return renderEnding();
  const node = NODES[id];
  S.node = id; S.moods = {};
  if (typeof node.day === 'number') S.day = node.day;
  updateHud();
  ({ predict:renderPredict, choice:renderChoice, call:renderCall, inbox:renderInbox, checklist:renderChecklist, redact:renderRedact })[node.type](node);
}

$('#restartBtn').addEventListener('click', ()=>{ stopCallTimer(); renderStart(); $('#nodeTitle').focus(); });
renderStart();
</script>
